<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#1f3a5f" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>英句囊 · 经典英文名句</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js"></script>
  <style>
    :root{
      --bg1:#eef3fb; --bg2:#dde7f5;
      --ink:#1f2d3d; --muted:#6b7a90;
      --card:#ffffff; --line:#e4e9f2;
      --accent:#1f3a5f; --accent2:#3b6ea5;
      --hi:#fff3bf; --hi-ink:#8a6d00;
      --fs-q: clamp(20px, 5.4vw, 30px);
      --fs-zh: clamp(15px, 4vw, 20px);
      --fs-meta: clamp(13px, 3.4vw, 16px);
    }
    *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
    html,body{margin:0; padding:0; height:100%;}
    body{
      font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC","Helvetica Neue",Arial,sans-serif;
      color:var(--ink);
      background:linear-gradient(160deg,var(--bg1),var(--bg2));
      min-height:100dvh;
      padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    #app{max-width:680px; margin:0 auto; padding:clamp(14px,4vw,22px); display:flex; flex-direction:column; min-height:100dvh;}

    .topbar{text-align:center; margin-bottom:clamp(12px,3vw,18px);}
    .brand{font-size:clamp(24px,7vw,34px); font-weight:700; letter-spacing:4px; color:var(--accent);}
    .brand .accent{color:#c0392b;}
    .sub{font-size:var(--fs-meta); color:var(--muted); margin-top:4px; letter-spacing:1px;}

    .controls{margin-bottom:clamp(12px,3vw,18px);}
    .search input{
      width:100%; padding:clamp(10px,2.6vw,13px) clamp(12px,3vw,16px);
      border:1px solid var(--line); border-radius:14px; background:var(--card);
      font-size:var(--fs-meta); color:var(--ink); outline:none;
    }
    .search input:focus{border-color:var(--accent2);}
    .tags{display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; justify-content:center;}
    .tags button{
      border:1px solid var(--line); background:var(--card); color:var(--muted);
      padding:5px 11px; border-radius:999px; font-size:clamp(11px,3vw,13px); cursor:pointer;
    }
    .tags button.on{background:var(--accent); color:#fff; border-color:var(--accent);}

    .stage{flex:1; display:flex; flex-direction:column; justify-content:center;}
    .card{
      background:var(--card); border:1px solid var(--line); border-radius:20px;
      padding:clamp(20px,5vw,32px); box-shadow:0 10px 30px rgba(31,58,95,.08);
      text-align:center;
    }
    .quote{
      font-family:Georgia,"Times New Roman",serif;
      font-size:var(--fs-q); line-height:1.55; color:var(--ink); font-weight:500;
      text-align:left;
    }
    .zh{
      margin-top:clamp(14px,3.5vw,20px); text-align:left;
      font-size:var(--fs-zh); color:var(--muted); line-height:1.6;
    }
    .meta{margin-top:clamp(16px,4vw,22px); font-size:var(--fs-meta); color:var(--accent);}
    .meta .author{font-style:italic; font-weight:600;}
    .meta .work{color:var(--muted); margin-left:8px; font-style:normal;}
    .actions{display:flex; gap:10px; justify-content:center; margin-top:clamp(16px,4vw,22px); flex-wrap:wrap;}
    .actions button{
      border:none; border-radius:12px; padding:10px 18px; font-size:var(--fs-meta); cursor:pointer;
      background:var(--accent); color:#fff; font-weight:600;
    }
    .actions button.toggle{background:#eef1f6; color:var(--accent);}
    .actions button:disabled{opacity:.45; cursor:not-allowed;}

    .nav{display:flex; align-items:center; justify-content:center; gap:10px; margin-top:clamp(14px,3.5vw,20px); flex-wrap:wrap;}
    .nav button{
      border:1px solid var(--line); background:var(--card); color:var(--accent);
      padding:8px 14px; border-radius:12px; font-size:var(--fs-meta); cursor:pointer;
    }
    .nav .shuffle{background:var(--accent2); color:#fff; border-color:var(--accent2);}
    .nav .count{font-size:var(--fs-meta); color:var(--muted); min-width:64px; text-align:center;}

    .foot{text-align:center; font-size:clamp(11px,3vw,13px); color:var(--muted); margin-top:clamp(14px,3.5vw,20px);}
    .err{background:#fff3f3; color:#c0392b; border:1px solid #f3c9c9; border-radius:12px; padding:14px; text-align:center; font-size:var(--fs-meta);}
  </style>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">英<span class="accent">句</span>囊</div>
      <div class="sub">经典英文名句 · 中英对照</div>
    </header>

    <div class="controls">
      <div class="search">
        <input v-model="query" type="search" placeholder="搜索英文 / 中文 / 作者…" />
      </div>
      <div class="tags">
        <button :class="{on: activeTag===null}" @click="activeTag=null">全部</button>
        <button v-for="t in allTags" :key="t" :class="{on: activeTag===t}" @click="activeTag = activeTag===t ? null : t">{{ tagLabel(t) }}</button>
      </div>
    </div>

    <main class="stage">
      <div v-if="!loaded" class="card"><div class="quote">载入中…</div></div>
      <div v-else-if="error" class="err">{{ error }}</div>
      <template v-else-if="current">
        <div class="card">
          <div class="quote">{{ current.text }}</div>
          <div class="zh" v-if="showZh">{{ current.zh }}</div>
          <div class="meta">
            <span class="author">— {{ current.author }}</span>
            <span class="work" v-if="current.work">《{{ current.work }}》</span>
          </div>
          <div class="actions">
            <button class="toggle" @click="showZh=!showZh">{{ showZh ? '隐藏翻译' : '显示翻译' }}</button>
          </div>
        </div>
        <div class="nav">
          <button @click="prev">‹ 上一句</button>
          <span class="count">{{ idx+1 }} / {{ view.length }}</span>
          <button @click="next">下一句 ›</button>
          <button class="shuffle" @click="shuffle">🎲 随机</button>
        </div>
      </template>
    </main>

    <footer class="foot">
      <span v-if="query || activeTag">匹配 {{ view.length }} 条 · </span>
      共 {{ all.length }} 条经典公版名句
    </footer>
  </div>

  <script>
    const { createApp } = Vue;
    const APP_VERSION = '3';

    // 版本校验：若线上版本更新，强制刷新以甩开旧缓存（微信/浏览器缓存陷阱）
    (function(){
      try{
        const v = localStorage.getItem('english-quotes-version');
        if(v && v !== APP_VERSION){
          localStorage.setItem('english-quotes-version', APP_VERSION);
          location.reload();
          return;
        }
        localStorage.setItem('english-quotes-version', APP_VERSION);
      }catch(e){}
    })();

    // 密码学安全随机，优先 crypto，回退 Math.random
    function randInt(n){
      if(!(n>0)) return 0;
      try{
        if(globalThis.crypto && globalThis.crypto.getRandomValues){
          const buf = new Uint32Array(1);
          globalThis.crypto.getRandomValues(buf);
          return buf[0] % n;
        }
      }catch(e){}
      return Math.floor(Math.random()*n);
    }

    createApp({
      data(){
        return {
          all:[], loaded:false, error:'',
          query:'', activeTag:null, idx:0,
          showZh:true,
        };
      },
      computed:{
        view(){
          const q = this.query.trim().toLowerCase();
          return this.all.filter(p=>{
            if(this.activeTag && !p.tags.includes(this.activeTag)) return false;
            if(!q) return true;
            return (p.text+' '+p.zh+' '+p.author+' '+p.work).toLowerCase().includes(q);
          });
        },
        current(){ return this.view[this.idx] || null; },
        allTags(){
          const s = new Set();
          this.all.forEach(p=>p.tags.forEach(t=>s.add(t)));
          return Array.from(s);
        },
      },
      watch:{
        query(){ this.idx = 0; },
        activeTag(){ this.idx = 0; },
      },
      methods:{
        tagLabel(t){
          const m = {wisdom:'智慧',courage:'勇气',friendship:'友谊',love:'爱情',perseverance:'坚韧',time:'时间',learning:'学习',happiness:'幸福',character:'品格',success:'成功',life:'人生',freedom:'自由',nature:'自然',truth:'真理',hope:'希望'};
          return m[t] || t;
        },
        shuffle(){ if(this.view.length) this.idx = randInt(this.view.length); },
        prev(){ if(!this.view.length) return; this.idx = (this.idx - 1 + this.view.length) % this.view.length; },
        next(){ if(!this.view.length) return; this.idx = (this.idx + 1) % this.view.length; },
        async load(){
          const url = `quotes.json?v=${APP_VERSION}`;
          let lastErr = null;
          for(let attempt=0; attempt<3; attempt++){
            try{
              const res = await fetch(url, {cache:'no-cache'});
              const ct = res.headers.get('content-type') || '';
              if(res.status!==200 || !ct.includes('json')){ lastErr='数据格式异常（非 JSON）'; continue; }
              this.all = await res.json();
              this.loaded = true; this.error='';
              this.shuffle(); // 每次打开随机起手
              return;
            }catch(e){ lastErr = e.message || String(e); }
          }
          this.error = '加载失败，请下拉刷新重试（'+lastErr+'）';
        },
      },
      mounted(){
        this.load();
      },
    }).mount('#app');
  </script>

  <script>
    // ===== Service Worker 注册（微信内禁用，避免缓存陷阱）=====
    if('serviceWorker' in navigator && !/MicroMessenger/i.test(navigator.userAgent)){
      window.addEventListener('load', ()=>{
        navigator.serviceWorker.register('sw.js').then(reg=>{
          // 发现新版本立即接管并刷新，避免旧缓存长期停留
          reg.addEventListener('updatefound', ()=>{
            const sw = reg.installing;
            sw.addEventListener('statechange', ()=>{
              if(sw.state === 'activated') location.reload();
            });
            sw.postMessage({type:'skipWaiting'});
          });
          if(reg.waiting) reg.waiting.postMessage({type:'skipWaiting'});
        }).catch(()=>{});
      });
    }
  </script>
</body>
</html>
