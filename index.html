<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#2c3e50" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>英句囊 · 经典英文名句</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js"></script>
  <style>
    :root{
      --bg1:#f4f6f9; --bg2:#e7ecf3;
      --ink:#2b3a4a; --ink-soft:#56708a;
      --muted:#8a9bb0;
      --card:#ffffff; --line:#e8edf3;
      --accent:#2c4a6e; --accent2:#4a7bb0;
      --quote:#d9e2ec;
      --fs-brand: clamp(26px, 7.5vw, 38px);
      --fs-q: clamp(20px, 5.2vw, 29px);
      --fs-zh: clamp(15px, 3.9vw, 20px);
      --fs-meta: clamp(13px, 3.3vw, 15px);
      --fs-sub: clamp(12px, 3.1vw, 14px);
    }
    *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
    html,body{margin:0; padding:0; min-height:100%;}
    body{
      font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC","Helvetica Neue",Arial,sans-serif;
      color:var(--ink);
      background:linear-gradient(165deg,var(--bg1),var(--bg2));
      min-height:100dvh;
      padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    #app{max-width:660px; margin:0 auto; padding:clamp(18px,4.5vw,28px) clamp(16px,4vw,22px); display:flex; flex-direction:column; min-height:100dvh;}

    .topbar{text-align:center; margin-bottom:clamp(18px,4vw,26px);}
    .brand{font-size:var(--fs-brand); font-weight:700; letter-spacing:6px; color:var(--accent);}
    .brand .accent{color:#c0392b;}
    .sub{font-size:var(--fs-sub); color:var(--muted); margin-top:6px; letter-spacing:2px;}

    .controls{margin-bottom:clamp(16px,4vw,22px);}
    .search input{
      width:100%; padding:clamp(11px,2.8vw,14px) clamp(14px,3.2vw,18px);
      border:1px solid var(--line); border-radius:16px; background:var(--card);
      font-size:var(--fs-meta); color:var(--ink); outline:none; transition:border-color .15s, box-shadow .15s;
    }
    .search input:focus{border-color:var(--accent2); box-shadow:0 0 0 3px rgba(74,123,176,.12);}
    .tags{display:flex; flex-wrap:wrap; gap:7px; margin-top:12px; justify-content:center;}
    .tags button{
      border:1px solid var(--line); background:var(--card); color:var(--muted);
      padding:6px 13px; border-radius:999px; font-size:clamp(11px,3vw,13px); cursor:pointer; transition:all .15s;
    }
    .tags button.on{background:var(--accent); color:#fff; border-color:var(--accent);}

    .stage{flex:1; display:flex; flex-direction:column; justify-content:center;}
    .card{
      position:relative; background:var(--card); border:1px solid var(--line); border-radius:26px;
      padding:clamp(26px,6vw,40px) clamp(22px,5.5vw,36px); box-shadow:0 14px 40px rgba(44,74,110,.08);
      overflow:hidden;
    }
    .card .mark{
      position:absolute; top:-12px; left:14px; font-family:Georgia,serif; font-size:96px; line-height:1;
      color:var(--quote); pointer-events:none; user-select:none; font-weight:700;
    }
    .quote{
      position:relative; font-family:Georgia,"Times New Roman",serif;
      font-size:var(--fs-q); line-height:1.65; color:var(--ink); font-weight:500;
      text-align:left; margin-top:18px;
    }
    .zh{
      position:relative; margin-top:clamp(16px,4vw,22px); text-align:left;
      font-size:var(--fs-zh); color:var(--ink-soft); line-height:1.7;
    }
    .meta{
      position:relative; margin-top:clamp(22px,5vw,30px); padding-top:clamp(14px,3.5vw,18px);
      border-top:1px solid var(--line); display:flex; flex-direction:column; gap:4px;
    }
    .meta .author-zh{font-size:clamp(15px,3.6vw,18px); font-weight:700; color:var(--accent); letter-spacing:.5px;}
    .meta .author-en{font-size:var(--fs-sub); color:var(--muted); font-style:italic;}
    .meta .work{font-style:normal; color:var(--accent2); margin-left:6px;}

    .actions{display:flex; gap:10px; justify-content:center; margin-top:clamp(20px,4.5vw,26px); flex-wrap:wrap;}
    .actions button{
      border:none; border-radius:14px; padding:11px 22px; font-size:var(--fs-meta); cursor:pointer;
      background:var(--accent); color:#fff; font-weight:600; transition:transform .1s, opacity .15s;
    }
    .actions button:active{transform:scale(.97);}
    .actions button.toggle{background:#eef2f7; color:var(--accent);}

    .nav{display:flex; align-items:center; justify-content:center; gap:10px; margin-top:clamp(16px,4vw,22px); flex-wrap:wrap;}
    .nav button{
      border:1px solid var(--line); background:var(--card); color:var(--accent);
      padding:9px 16px; border-radius:13px; font-size:var(--fs-meta); cursor:pointer; transition:background .15s, transform .1s;
    }
    .nav button:active{transform:scale(.97);}
    .nav .shuffle{background:var(--accent2); color:#fff; border-color:var(--accent2);}
    .nav .count{font-size:var(--fs-meta); color:var(--muted); min-width:68px; text-align:center;}

    .foot{text-align:center; font-size:clamp(11px,3vw,13px); color:var(--muted); margin-top:clamp(16px,4vw,22px);}
    .err{background:#fff3f3; color:#c0392b; border:1px solid #f3c9c9; border-radius:14px; padding:16px; text-align:center; font-size:var(--fs-meta);}
  </style>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">英<span class="accent">句</span>囊</div>
      <div class="sub">经典英文名句 · 中英对照</div>
    </header>

    <div class="controls">
      <div class="search">
        <input v-model="query" type="search" placeholder="搜索英文 / 中文 / 作者…" />
      </div>
      <div class="tags">
        <button :class="{on: activeTag===null}" @click="activeTag=null">全部</button>
        <button v-for="t in allTags" :key="t" :class="{on: activeTag===t}" @click="activeTag = activeTag===t ? null : t">{{ tagLabel(t) }}</button>
      </div>
    </div>

    <main class="stage">
      <div v-if="!loaded" class="card"><div class="quote">载入中…</div></div>
      <div v-else-if="error" class="err">{{ error }}</div>
      <template v-else-if="current">
        <div class="card">
          <div class="mark">“</div>
          <div class="quote">{{ current.text }}</div>
          <div class="zh" v-if="showZh">{{ current.zh }}</div>
          <div class="meta">
            <div class="author-zh">{{ current.authorZh }}</div>
            <div class="author-en">{{ current.author }}<span v-if="current.work" class="work">《{{ current.work }}》</span></div>
          </div>
          <div class="actions">
            <button class="toggle" @click="showZh=!showZh">{{ showZh ? '隐藏翻译' : '显示翻译' }}</button>
          </div>
        </div>
        <div class="nav">
          <button @click="prev">‹ 上一句</button>
          <span class="count">{{ idx+1 }} / {{ view.length }}</span>
          <button @click="next">下一句 ›</button>
          <button class="shuffle" @click="shuffle">🎲 随机</button>
        </div>
      </template>
    </main>

    <footer class="foot">
      <span v-if="query || activeTag">匹配 {{ view.length }} 条 · </span>
      共 {{ all.length }} 条经典公版名句
    </footer>
  </div>

  <script>
    const { createApp } = Vue;
    const APP_VERSION = '4';

    // 版本校验：若线上版本更新，强制刷新以甩开旧缓存（微信/浏览器缓存陷阱）
    (function(){
      try{
        const v = localStorage.getItem('english-quotes-version');
        if(v && v !== APP_VERSION){
          localStorage.setItem('english-quotes-version', APP_VERSION);
          location.reload();
          return;
        }
        localStorage.setItem('english-quotes-version', APP_VERSION);
      }catch(e){}
    })();

    // 密码学安全随机，优先 crypto，回退 Math.random
    function randInt(n){
      if(!(n>0)) return 0;
      try{
        if(globalThis.crypto && globalThis.crypto.getRandomValues){
          const buf = new Uint32Array(1);
          globalThis.crypto.getRandomValues(buf);
          return buf[0] % n;
        }
      }catch(e){}
      return Math.floor(Math.random()*n);
    }

    createApp({
      data(){
        return {
          all:[], loaded:false, error:'',
          query:'', activeTag:null, idx:0,
          showZh:true,
        };
      },
      computed:{
        view(){
          const q = this.query.trim().toLowerCase();
          return this.all.filter(p=>{
            if(this.activeTag && !p.tags.includes(this.activeTag)) return false;
            if(!q) return true;
            return (p.text+' '+p.zh+' '+p.author+' '+p.authorZh+' '+p.work).toLowerCase().includes(q);
          });
        },
        current(){ return this.view[this.idx] || null; },
        allTags(){
          const s = new Set();
          this.all.forEach(p=>p.tags.forEach(t=>s.add(t)));
          return Array.from(s);
        },
      },
      watch:{
        query(){ this.idx = 0; },
        activeTag(){ this.idx = 0; },
      },
      methods:{
        tagLabel(t){
          const m = {wisdom:'智慧',courage:'勇气',friendship:'友谊',love:'爱情',perseverance:'坚韧',time:'时间',learning:'学习',happiness:'幸福',character:'品格',success:'成功',life:'人生',freedom:'自由',nature:'自然',truth:'真理',hope:'希望'};
          return m[t] || t;
        },
        shuffle(){ if(this.view.length) this.idx = randInt(this.view.length); },
        prev(){ if(!this.view.length) return; this.idx = (this.idx - 1 + this.view.length) % this.view.length; },
        next(){ if(!this.view.length) return; this.idx = (this.idx + 1) % this.view.length; },
        async load(){
          const url = `quotes.json?v=${APP_VERSION}`;
          let lastErr = null;
          for(let attempt=0; attempt<3; attempt++){
            try{
              const res = await fetch(url, {cache:'no-cache'});
              const ct = res.headers.get('content-type') || '';
              if(res.status!==200 || !ct.includes('json')){ lastErr='数据格式异常（非 JSON）'; continue; }
              this.all = await res.json();
              this.loaded = true; this.error='';
              this.shuffle(); // 每次打开随机起手
              return;
            }catch(e){ lastErr = e.message || String(e); }
          }
          this.error = '加载失败，请下拉刷新重试（'+lastErr+'）';
        },
      },
      mounted(){
        this.load();
      },
    }).mount('#app');
  </script>

  <script>
    // ===== Service Worker 注册（微信内禁用，避免缓存陷阱）=====
    if('serviceWorker' in navigator && !/MicroMessenger/i.test(navigator.userAgent)){
      window.addEventListener('load', ()=>{
        navigator.serviceWorker.register('sw.js').then(reg=>{
          // 发现新版本立即接管并刷新，避免旧缓存长期停留
          reg.addEventListener('updatefound', ()=>{
            const sw = reg.installing;
            sw.addEventListener('statechange', ()=>{
              if(sw.state === 'activated') location.reload();
            });
            sw.postMessage({type:'skipWaiting'});
          });
          if(reg.waiting) reg.waiting.postMessage({type:'skipWaiting'});
        }).catch(()=>{});
      });
    }
  </script>
</body>
</html>
